# SonarQube Cloud automatic analysis (ADR-0229).
#
# Excluded: test code and developer or CI tooling. Their findings (world-writable
# temporary directories, hard-coded test credentials, fixed-seed generators,
# http:// fixtures, scripts reading the paths CI hands them) are what tests and
# build tooling do on purpose, and they failed the quality gate on new code.
#
# Still analysed, and must stay so: src/ and include/ (the server), packaging/
# (files installed on a user's system, such as the NetBSD rc.d script), and
# .github/ (the workflows: unpinned actions and unlocked dependencies are real
# supply-chain findings). Do not widen this list to quiet a finding in those.
sonar.exclusions=tests/**,scripts/**,build.py,llvm.sh,.codex/**
