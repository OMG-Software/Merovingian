#
# Puts the server's loopback-only client listener (127.0.0.1:8080, see
# merovingian.conf.template) on 8008, where Complement expects plain HTTP.
# The server trusts X-Forwarded-For from 127.0.0.1 only.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;

    # Uploads are bounded by the server (security.media.max_upload_size); nginx
    # must not refuse first with a response the server would not give.
    client_max_body_size 0;

    server {
        # IPv4 only: a container started with IPv6 disabled cannot bind [::].
        listen 8008;

        location / {
            # No URI part after the address: nginx then forwards the request
            # target exactly as received. With one it would decode %-escapes,
            # such as the %21 in an escaped room ID, before passing the path on.
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # Replaced, never appended to: a client's own X-Forwarded-For is dropped.
            proxy_set_header X-Forwarded-For $remote_addr;

            # Long-polls (/sync, sliding sync) stream their answer when it is ready.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
