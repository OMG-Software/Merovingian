# ADR-0257: a forgotten room is never listed in /sync. Client-Server API, "Leaving rooms":
# "Rooms which have been forgotten will never appear in the response to the /sync API, until
# the user re-joins, is re-invited, or knocks." Complement's own comment on this subtest says
# it runs counter to the spec.

[[entry]]
test = "TestRoomForget/Parallel/Leave_for_forgotten_room_shows_up_in_v2_incremental_/sync"
package = "tests/csapi"
mode = "expect-fail"
category = "spec"
spec = "docs/matrix-v1.19-spec/client-server-api.md#leaving-rooms"
reason = "Expects a forgotten room's leave in the next incremental /sync; the spec says forgotten rooms never appear in /sync until the user rejoins, is re-invited or knocks (ADR-0257)."
