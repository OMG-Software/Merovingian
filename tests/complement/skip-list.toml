category = "spec"
spec = "docs/matrix-v1.19-spec/client-server-api.md#client-behaviour"
reason = "Thumbnails remote media fetched during the run through /_matrix/media/v3; remote media cached after the freeze counts as new, so the frozen route answers 404 (ADR-0068)."

