test = "TestContent"
package = "tests/csapi"
mode = "expect-fail"
category = "spec"
spec = "docs/matrix-v1.19-spec/client-server-api.md#client-behaviour"
reason = "Downloads media uploaded during the run through /_matrix/media/v3/download, which the media freeze answers 404 (ADR-0068). TestContentCSAPIMediaV1 covers the authenticated route."

