# A late state event in a filtered /sync: S2 reaches this server after E4, so in stream order it is the
# last event the timeline filter keeps, and this server returns it as the timeline (limited) with the
# state before it. Complement skips Dendrite for the same reason ("S2 is put in the timeline, not state").

[[entry]]
test = "TestSyncOmitsStateChangeOnFilteredEvents"
package = "tests"
mode = "expect-fail"
category = "non-spec"
spec = "docs/matrix-v1.19-spec/client-server-api.md#get_matrixclientv3sync"
reason = "Expects the late m.room.name event S2 in state; this server returns S2 as the timeline's event and state up to the start of the timeline, as the spec defines state, so the client still learns it."
