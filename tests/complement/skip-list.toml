# MSC4311 / spec v1.16: an invite whose invite_room_state lacks m.room.create is refused with 400. The
# spec says servers SHOULD answer M_INVALID_PARAM; Complement expects M_MISSING_PARAM.

[[entry]]
test = "TestMSC4311RejectInvalidStrippedStateFederation/parallel/`m.room.create`_event_missing_from_`invite_room_state`"
package = "tests"
mode = "expect-fail"
category = "spec"
spec = "docs/matrix-v1.19-spec/server-server-api.md#put_matrixfederationv2inviteroomideventid"
reason = "This server refuses the invite with 400 M_INVALID_PARAM, the errcode the spec says servers SHOULD return for a missing m.room.create; the test expects M_MISSING_PARAM."

