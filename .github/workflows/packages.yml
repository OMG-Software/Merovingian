name: packages
on:
  push:
    # No 'feature/**': a pull request's branch would build every package twice for one commit (ADR-0511).
    branches: [main, 'codex/**', 'alpha-release']
  pull_request:
    branches: [main]
jobs:
  # ADR-0580: every job below that needs nothing else waits for this one, so the jobs a pull request starts at
  # once fit in the account's 20 runners and sonarcloud and CodeQL get one straight away. The jobs that wait use
  # `if: ${{ !cancelled() }}`: they still run if this fails, because a skipped required check counts as passed.
  queue-after-analyses:
    name: Queue after Sonar and CodeQL
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Let the long jobs queue
        run: "true"

  deb:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Debian package
    runs-on: ubuntu-latest
    container: ubuntu:latest
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to publish SLSA
      # provenance attestations to the repository's attestations store.
      attestations: write
      id-token: write
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            ccache \
            clang meson ninja-build pkg-config git make binutils \
            libssl-dev \
            libsodium-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libpng-dev \
            libturbojpeg0-dev \
            perl bison flex m4
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-deb-${{ github.run_id }}
          restore-keys: ccache-deb-
      - name: Build .deb
        run: sh scripts/build-deb.sh
      - name: Run the installed package's startup hardening gate
        # OPS-5: install the .deb as an operator would, then boot the installed
        # server as the package's unprivileged user with an empty capability
        # bounding set (what the systemd unit's CapabilityBoundingSet= gives
        # it) and require every startup hardening check to report enabled.
        run: |
          apt-get install -y --no-install-recommends ./merovingian_*.deb
          setpriv --reuid=merovingian --regid=merovingian --init-groups \
            --bounding-set=-all --inh-caps=-all \
            sh scripts/check-startup-hardening-gate.sh /usr/bin/merovingian-server
      - name: Attest Debian package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: merovingian_*.deb
          retention-days: 30

  static-linux-fallback:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Static Linux fallback binary
    runs-on: ubuntu-latest
    container: alpine:latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bison \
            binutils \
            ccache \
            clang \
            flex \
            g++ \
            git \
            curl-dev \
            curl-static \
            nghttp2-static \
            brotli-static \
            zstd-static \
            libsodium-dev \
            libsodium-static \
            linux-headers \
            make \
            meson \
            m4 \
            musl-dev \
            ninja \
            openssl-dev \
            openssl-libs-static \
            perl \
            libpq-dev \
            pkgconf \
            zlib-static
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-alpine-${{ github.run_id }}
          restore-keys: ccache-alpine-
      - name: Build static Linux fallback tarball
        run: sh scripts/build-static-linux.sh
      - name: Attest static Linux tarball
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*-linux-static-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: static-linux-fallback-package
          path: |
            merovingian-*-linux-static-x86_64.tar.gz
            merovingian-*-linux-static-x86_64.tar.gz.sha256
          retention-days: 30

  rpm:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Fedora RPM package (${{ matrix.image }})
    runs-on: ubuntu-latest
    # An RPM installs only on the Fedora release it was built on (ADR-0376).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            artifact: rpm-package-fc44
          - image: fedora:latest
            artifact: rpm-package-latest
    container: ${{ matrix.image }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y ccache clang meson ninja-build pkgconf-pkg-config git \
            openssl-devel \
            libsodium-devel \
            libpq-devel \
            libpng-devel \
            turbojpeg-devel \
            libcurl-devel \
            sqlite-devel \
            zlib-devel zlib-static \
            libnghttp2-devel \
            catch-devel perl bison flex m4 \
            rpm-build systemd-rpm-macros util-linux
      - uses: actions/checkout@v4
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-rpm-${{ matrix.artifact }}-${{ github.run_id }}
          restore-keys: ccache-rpm-${{ matrix.artifact }}-
      - name: Build .rpm
        run: sh scripts/build-rpm.sh
      - name: Run the installed package's startup hardening gate
        # OPS-5: install the RPM in the release it was built for, then boot the
        # installed server as the package's unprivileged user with an empty
        # capability bounding set, as the Debian package jobs do.
        run: |
          dnf install -y ./merovingian-*.rpm
          setpriv --reuid=merovingian --regid=merovingian --init-groups \
            --bounding-set=-all --inh-caps=-all \
            sh scripts/check-startup-hardening-gate.sh /usr/bin/merovingian-server
      # actions/attest-build-provenance occasionally fails with "InternalError:
      # error fetching tlog entry - (404) Not Found": Sigstore's Rekor
      # transparency log has not finished replicating the entry the action
      # itself just wrote by the time it tries to read it back. Retrying after
      # a short delay lets replication catch up — the same class of external
      # flake the dnf and zypper retry loops below handle for their own
      # dependencies.
      - name: Attest RPM package
        id: attest_rpm_1
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation
        if: steps.attest_rpm_1.outcome == 'failure'
        run: sleep 15
      - name: Attest RPM package (retry 1)
        id: attest_rpm_2
        if: steps.attest_rpm_1.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation again
        if: steps.attest_rpm_2.outcome == 'failure'
        run: sleep 30
      - name: Attest RPM package (retry 2)
        if: steps.attest_rpm_2.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: merovingian-*.rpm
          retention-days: 30

  # The main ruleset requires a check called "Fedora RPM package", and a matrix job
  # reports one check per image, none of them with that name.
  rpm-all-images:
    name: Fedora RPM package
    needs: rpm
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every Fedora image to pass
        env:
          RESULT: ${{ needs.rpm.result }}
        run: test "${RESULT}" = success

  freebsd-pkg:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: FreeBSD package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build FreeBSD .pkg
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y meson ninja llvm catch2 pkgconf git perl5 bison flex \
              gmake openssl libsodium postgresql17-client python3 curl png libjpeg-turbo
          # Install the package as an operator would and boot the installed server as
          # an unprivileged user (OPS-5). pkg add needs root, the server refuses it.
          run: |
            set -e
            sh scripts/build-freebsd-pkg.sh
            pkg add ./merovingian-*.pkg
            cp scripts/check-startup-hardening-gate.sh /tmp/check-startup-hardening-gate.sh
            su -m nobody -c "sh /tmp/check-startup-hardening-gate.sh /usr/local/bin/merovingian-server"
      - name: Attest FreeBSD package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-package
          path: merovingian-*.pkg

  openbsd-pkg:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: OpenBSD package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenBSD package
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          usesh: true
          prepare: |
            pkg_add -I meson ninja pkgconf git bison flex gmake openssl libsodium postgresql-client curl png jpeg-turbo
          run: sh scripts/build-openbsd-pkg.sh
      - name: Attest OpenBSD package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: openbsd-package
          path: merovingian-*.tgz

  netbsd-pkg:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: NetBSD package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build NetBSD package
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          usesh: true
          prepare: |
            # NetBSD's pkg_add needs PKG_PATH pointing at a binary-package
            # repository (the vmaction image exports none); without it every
            # stem fails with "no pkg found". Retry the official CDN and origin
            # because either endpoint can intermittently reject the CI VM.
            package_path="pub/pkgsrc/packages/NetBSD/$(uname -m)/$(uname -r | sed 's/_.*//')/All/"
            install_packages() {
              for mirror in cdn.netbsd.org ftp.netbsd.org; do
                export PKG_PATH="https://${mirror}/${package_path}"
                for attempt in 1 2 3; do
                  if /usr/sbin/pkg_add -U "$@"; then
                    return 0
                  fi
                  sleep $((attempt * 5))
                done
              done
              return 1
            }
            install_packages clang meson ninja-build pkgconf git bison flex gmake libsodium postgresql17-client curl png libjpeg-turbo
            # pkgsrc's curl and postgresql17-client link NetBSD's base OpenSSL
            # (libssl.so.16); building against pkgsrc's openssl (libssl.so.3)
            # would load two OpenSSLs in one process, which the werror link
            # refuses. Remove it if the image already has it, so base headers,
            # libraries and pkg-config files are the only OpenSSL in sight.
            if /usr/sbin/pkg_info -e openssl >/dev/null 2>&1; then /usr/sbin/pkg_delete openssl; fi
          run: sh scripts/build-netbsd-pkg.sh
      - name: Attest NetBSD package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: netbsd-package
          path: merovingian-*.tgz

  debian-pkg:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Debian trixie package
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            bison \
            ca-certificates \
            ccache \
            clang \
            flex \
            gcc \
            git \
            m4 \
            make \
            meson \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsodium-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libpng-dev \
            libturbojpeg0-dev \
            perl
      - uses: actions/checkout@v4
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-debian-pkg-${{ github.run_id }}
          restore-keys: ccache-debian-pkg-
      - name: Build .deb
        run: sh scripts/build-deb.sh
      - name: Run the installed package's startup hardening gate
        # OPS-5: see the same step in the deb job.
        run: |
          apt-get install -y --no-install-recommends ./merovingian_*.deb
          setpriv --reuid=merovingian --regid=merovingian --init-groups \
            --bounding-set=-all --inh-caps=-all \
            sh scripts/check-startup-hardening-gate.sh /usr/bin/merovingian-server
      - name: Attest Debian package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: merovingian_*.deb
          retention-days: 30

  docker-image:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Docker image startup gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build --tag merovingian:ci .
      - name: Run the image's startup hardening gate
        # OPS-5: boot the shipped server inside the image as the image's own
        # unprivileged user, with every capability dropped as the Dockerfile
        # documents, and require every startup hardening check to report
        # enabled. Without --federation-worker the server spawns the worker
        # from its libexec path, so this also proves the image ships it.
        run: |
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --volume "$PWD/scripts/check-startup-hardening-gate.sh:/usr/local/bin/check-startup-hardening-gate.sh:ro" \
            --entrypoint /bin/sh \
            merovingian:ci \
            /usr/local/bin/check-startup-hardening-gate.sh /usr/bin/merovingian-server

  complement-image:
    name: Complement image smoke test
    # Builds tests/complement from the trixie package this run built and starts
    # it as Complement does, so the image cannot rot between releases. No Go,
    # no Complement: that run is the maintainer's (tests/complement/AGENTS.md).
    needs: debian-pkg
    # ADR-0580: the result of debian-pkg itself, never the implicit success(), which also
    # looks at the gate debian-pkg waits for and would skip this check when only the gate failed.
    if: ${{ !cancelled() && needs.debian-pkg.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: debian-package/
      - name: Stage the package
        run: |
          set -eu
          set -- debian-package/merovingian_*.deb
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one package, found: $*" >&2
            exit 1
          fi
          mkdir -p tests/complement/artifact
          cp "$1" tests/complement/artifact/merovingian.deb
          echo "MEROVINGIAN_DEB_SHA256=$(sha256sum tests/complement/artifact/merovingian.deb | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Build the Complement image
        run: |
          docker build \
            --build-arg "MEROVINGIAN_DEB_SHA256=${MEROVINGIAN_DEB_SHA256}" \
            --tag merovingian-complement:ci \
            tests/complement
      - name: Make a CA as Complement mounts it
        run: |
          mkdir complement-ca
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout complement-ca/ca.key -out complement-ca/ca.crt -days 1 \
            -subj "/CN=Complement CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
      - name: Start the image as Complement does
        # SERVER_NAME and the CA mount are all Complement gives. It drops no
        # capabilities, so the entrypoint must, and Landlock is not waived.
        run: |
          docker run --detach --name hs1 \
            --env SERVER_NAME=hs1 \
            --volume "$PWD/complement-ca:/complement/ca:ro" \
            --publish 127.0.0.1:18008:8008 \
            --publish 127.0.0.1:18448:8448 \
            merovingian-complement:ci
          cat > wait-healthy.sh <<'EOF'
          for _ in $(seq 1 120); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' hs1)" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' hs1)" = true ] || break
            sleep 1
          done
          echo "hs1 did not become healthy" >&2
          exit 1
          EOF
          sh wait-healthy.sh
      - name: Check the client API offers open registration through nginx
        run: |
          set -eu
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18008/_matrix/client/versions
          # No auth: 401 and the m.login.dummy flow (ADR-0232).
          status=$(curl --silent --output register.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:18008/_matrix/client/v3/register)
          cat register.json
          [ "$status" = 401 ]
          jq -e '.flows | any(.stages == ["m.login.dummy"])' register.json
      - name: Check federation over TLS, trusting only the test CA
        run: |
          set -eu
          tls="--cacert complement-ca/ca.crt --resolve hs1:18448:127.0.0.1"
          curl --fail --silent --show-error $tls https://hs1:18448/_matrix/key/v2/server > key-before.json
          jq -e '.server_name == "hs1"' key-before.json
          # Answered by the federation worker, so this also shows it is running.
          curl --fail --silent --show-error $tls https://hs1:18448/_matrix/federation/v1/version
      - name: Check the server runs unprivileged with no capabilities
        run: |
          set -eu
          docker exec hs1 grep -E '^(Uid|CapBnd|CapEff|NoNewPrivs):' /proc/1/status | tee status.txt
          if grep -qE '^Uid:\s+0\s' status.txt; then
            echo "the server runs as root" >&2
            exit 1
          fi
          grep -qE '^CapBnd:\s+0+$' status.txt
          grep -qE '^CapEff:\s+0+$' status.txt
          grep -qE '^NoNewPrivs:\s+1$' status.txt
      - name: Restart and check the signing key survives
        run: |
          set -eu
          docker restart hs1
          sh wait-healthy.sh
          curl --fail --silent --show-error --cacert complement-ca/ca.crt --resolve hs1:18448:127.0.0.1 \
            https://hs1:18448/_matrix/key/v2/server > key-after.json
          [ "$(jq -cS .verify_keys key-before.json)" = "$(jq -cS .verify_keys key-after.json)" ]
      - name: Show the container log
        if: always()
        run: docker logs hs1 || true

  rhel-rpm:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: RHEL-compatible (AlmaLinux 10) RPM
    runs-on: ubuntu-latest
    container: almalinux:10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Install EPEL and build dependencies
        # A mirror occasionally answers with broken repository metadata ("Failed to
        # download metadata for repo 'extras': repomd.xml parser error"), which fails
        # the job before anything is built. Retry with the cached metadata cleared, as
        # the OpenSUSE job retries zypper, and fail the step when the attempts run out.
        run: |
          for attempt in 1 2 3; do
            if dnf install -y epel-release && \
               dnf install -y ccache clang meson ninja-build pkgconf-pkg-config git \
                 openssl-devel \
                 libsodium-devel \
                 libpq-devel \
                 libpng-devel \
                 turbojpeg-devel \
                 libcurl-devel \
                 perl bison flex m4 \
                 rpm-build systemd-rpm-macros; then
              break
            fi
            if [ "${attempt}" = 3 ]; then
              exit 1
            fi
            echo "dnf attempt ${attempt} failed; retrying in 15s"
            dnf clean metadata
            sleep 15
          done
      - uses: actions/checkout@v4
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-rhel-rpm-${{ github.run_id }}
          restore-keys: ccache-rhel-rpm-
      - name: Build RHEL .rpm
        run: sh scripts/build-rhel-rpm.sh
      # See the Fedora RPM job above for why this retries: Sigstore's Rekor
      # transparency log occasionally hasn't replicated an entry by the time
      # the same action tries to read it back ("error fetching tlog entry -
      # (404) Not Found").
      - name: Attest RHEL RPM
        id: attest_rhel_rpm_1
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation
        if: steps.attest_rhel_rpm_1.outcome == 'failure'
        run: sleep 15
      - name: Attest RHEL RPM (retry 1)
        id: attest_rhel_rpm_2
        if: steps.attest_rhel_rpm_1.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation again
        if: steps.attest_rhel_rpm_2.outcome == 'failure'
        run: sleep 30
      - name: Attest RHEL RPM (retry 2)
        if: steps.attest_rhel_rpm_2.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rhel-rpm-package
          path: merovingian-*.rpm
          retention-days: 30

  opensuse-rpm:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: OpenSUSE Tumbleweed RPM
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install build dependencies
        run: |
          set -e
          # Transient CDN timeouts fetching Tumbleweed repo metadata are the
          # most common cause of OpenSUSE CI failures.  Retry refresh + install
          # a few times before giving up; --gpg-auto-import-keys tolerates key
          # rotation on the download mirrors.
          #
          # `zypper dup` first syncs every package already on the image
          # (including runtime libs like libpsl5) to the current repo
          # snapshot before we ask for anything new. Tumbleweed is a rolling
          # release built independently of the opensuse/tumbleweed Docker
          # image, so the image's baked-in package set can briefly outpace
          # (or lag) the live repo; without this, `zypper install` can hit a
          # solver conflict (e.g. libcurl-devel needing a pkgconfig(libpsl)
          # version older than the image's preinstalled libpsl5) that no
          # amount of retrying the same install resolves, since it isn't a
          # transient failure.
          for attempt in 1 2 3; do
            if zypper --non-interactive --gpg-auto-import-keys refresh && \
               zypper --non-interactive dup && \
               zypper --non-interactive install -y \
                 ccache clang gcc-c++ meson ninja pkg-config git \
                 libopenssl-devel \
                 libsodium-devel \
                 postgresql-devel \
                 libpng16-devel \
                 libjpeg8-devel \
                 libcurl-devel \
                 sqlite3-devel \
                 perl bison flex m4 \
                 rpm-build systemd-rpm-macros; then
              break
            fi
            echo "zypper attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-opensuse-rpm-${{ github.run_id }}
          restore-keys: ccache-opensuse-rpm-
          save-always: true
      - name: Configure ccache
        run: |
          # ccache-action@v1.2 does not recognise the 'install' parameter and
          # has no zypper support, so it fails on a cold cache.  Wire ccache
          # manually: ccache is already installed by the zypper step above.
          # Use CC/CXX prefix mode instead of GITHUB_PATH symlinks: modifying
          # GITHUB_PATH inside a Docker container step can corrupt the PATH
          # seen by subsequent steps, leaving 'sh' unfindable.
          ccache --set-config=max_size=500M
          echo "CC=ccache clang" >> "$GITHUB_ENV"
          echo "CXX=ccache clang++" >> "$GITHUB_ENV"
      - name: Build OpenSUSE .rpm
        run: sh scripts/build-opensuse-rpm.sh
      # See the Fedora RPM job above for why this retries: Sigstore's Rekor
      # transparency log occasionally hasn't replicated an entry by the time
      # the same action tries to read it back ("error fetching tlog entry -
      # (404) Not Found").
      - name: Attest OpenSUSE RPM
        id: attest_opensuse_rpm_1
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation
        if: steps.attest_opensuse_rpm_1.outcome == 'failure'
        run: sleep 15
      - name: Attest OpenSUSE RPM (retry 1)
        id: attest_opensuse_rpm_2
        if: steps.attest_opensuse_rpm_1.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: merovingian-*.rpm
      - name: Wait before retrying attestation again
        if: steps.attest_opensuse_rpm_2.outcome == 'failure'
        run: sleep 30
      - name: Attest OpenSUSE RPM (retry 2)
        if: steps.attest_opensuse_rpm_2.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: merovingian-*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: opensuse-rpm-package
          path: merovingian-*.rpm
          retention-days: 30

  stage-package-assets:
    name: Stage unsigned package assets
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb, static-linux-fallback, rpm, freebsd-pkg, openbsd-pkg, netbsd-pkg, debian-pkg, rhel-rpm, opensuse-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: packages/
      - uses: actions/download-artifact@v4
        with:
          name: static-linux-fallback-package
          path: packages/
      # Each Fedora RPM carries its release's dist tag (.fc44, .fc45), so their
      # file names are unique and can land directly in packages/.
      - uses: actions/download-artifact@v4
        with:
          name: rpm-package-fc44
          path: packages/
      - uses: actions/download-artifact@v4
        with:
          name: rpm-package-latest
          path: packages/
      - uses: actions/download-artifact@v4
        with:
          name: freebsd-package
          path: packages/
      # OpenBSD and NetBSD both emit merovingian-<version>.tgz; download to
      # separate dirs and re-suffix so the flat release bundle does not collide.
      - uses: actions/download-artifact@v4
        with:
          name: openbsd-package
          path: packages-openbsd/
      - uses: actions/download-artifact@v4
        with:
          name: netbsd-package
          path: packages-netbsd/
      # Debian trixie and Ubuntu both produce merovingian_<ver>_<arch>.deb;
      # download to a separate dir and re-suffix to avoid collision.
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: packages-debian/
      # RHEL and OpenSUSE RPMs carry distinct dist tags (.el10 / .opensuse) so
      # their filenames are unique and can land directly in packages/.
      - uses: actions/download-artifact@v4
        with:
          name: rhel-rpm-package
          path: packages/
      - uses: actions/download-artifact@v4
        with:
          name: opensuse-rpm-package
          path: packages/
      - name: Disambiguate BSD tarball and Debian package names
        run: |
          for f in packages-openbsd/*.tgz; do
            mv "$f" "packages/$(basename "${f%.tgz}")-openbsd.tgz"
          done
          for f in packages-netbsd/*.tgz; do
            mv "$f" "packages/$(basename "${f%.tgz}")-netbsd.tgz"
          done
          for f in packages-debian/*.deb; do
            mv "$f" "packages/$(basename "${f%.deb}")-debian.deb"
          done
      - name: Generate license summary
        run: python scripts/generate-license-summary.py packages/merovingian.licenses.json

      # Before the checksums and signing, so SHA256SUMS lists the SBOM and it
      # gets a detached signature like every package (ADR-0598).
      - name: Generate SBOM
        run: |
          python scripts/generate_sbom.py \
            --spdx packages/merovingian.spdx.json \
            --cyclonedx packages/merovingian.cdx.json \
            --commit "${{ github.sha }}" \
            --repository "${{ github.repository }}"

      - name: Generate checksums
        run: sha256sum packages/* > packages/SHA256SUMS
      - name: Upload unsigned package assets
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages
          path: packages/
          if-no-files-found: error
          retention-days: 30

  sign-package-assets:
    name: GPG-sign package assets
    needs: [stage-package-assets, deb, static-linux-fallback, rpm, freebsd-pkg, openbsd-pkg, netbsd-pkg, debian-pkg, rhel-rpm, opensuse-rpm]
    # GitHub implicitly ANDs a bare expression with success(), and that default
    # success() returns false when any job in the broader dependency graph was
    # skipped (e.g. a job whose own `if` is false). failure() looks at that whole
    # graph too, the queue-after-analyses gate included (ADR-0580), so signing
    # checks the jobs it depends on by name: staging succeeded and no package
    # job failed or was cancelled, whatever the gate did.
    if: |
      !cancelled() &&
      needs.stage-package-assets.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/sign-artifacts.yml
    with:
      source_artifact_name: unsigned-packages
      output_artifact_name: signed-packages
    # The key is a secret of the `release` environment, which the called job
    # declares; a job that calls a reusable workflow cannot (ADR-0614).
    secrets: inherit

  publish-latest:
    name: Publish rolling latest
    needs: sign-package-assets
    # Signing runs only when staging succeeded and no package job failed or was
    # cancelled, so its result is the whole check; failure() would also see the
    # gate (ADR-0580).
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.sign-package-assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-packages
          path: packages/
      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete latest \
              --repo "${{ github.repository }}" \
              --yes \
              --cleanup-tag
          fi
          gh release create latest \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Latest ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
            --notes "Rolling release from \`main\` — commit \`${{ github.sha }}\`. Built with hardened profile. Replaced on every push to main. Each package is accompanied by a detached GPG signature (\`.asc\`). The SBOM is \`merovingian.spdx.json\` (SPDX 2.3) and \`merovingian.cdx.json\` (CycloneDX 1.5)." \
            packages/*
