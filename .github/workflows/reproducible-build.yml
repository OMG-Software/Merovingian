name: reproducible-build

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/build-static-linux.sh'
      - 'scripts/reproducible-build.sh'
      - 'meson.build'
      - 'subprojects/**'
  workflow_dispatch:

jobs:
  # ADR-0580, ADR-0743: a build and test job, so it joins the runner queue after the analyses, as ci.yml's do.
  # `!cancelled()`: it still runs if the gate fails, because a skipped required check counts as passed.
  queue-after-analyses:
    name: Queue after the analyses
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Let the analyses queue first
        run: "true"

  verify:
    needs: queue-after-analyses
    if: ${{ !cancelled() }}
    name: Verify static Linux tarball reproducibility
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is not required; only the HEAD commit date is needed.
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bison \
            binutils \
            clang \
            flex \
            g++ \
            git \
            curl-dev \
            curl-static \
            nghttp2-static \
            brotli-static \
            zstd-static \
            libsodium-dev \
            libsodium-static \
            linux-headers \
            make \
            meson \
            m4 \
            musl-dev \
            ninja \
            openssl-dev \
            openssl-libs-static \
            perl \
            libpq-dev \
            pkgconf \
            tar \
            zlib-static

      - name: Verify reproducible build
        run: sh scripts/reproducible-build.sh
