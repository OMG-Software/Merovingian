name: coverage

# One instrumented build and one run of every suite (unit, conformance, integration,
# smoke) feed everything that measures coverage: gcovr writes the Cobertura report
# Codecov takes and the SonarQube-format report the SonarQube Cloud scan takes
# (ADR-0250), and the scan reads the compilation database of this same build. The
# job is named `coverage`, the name the main ruleset requires. It used to be two
# jobs, `coverage` and `sonarcloud`, that each compiled and ran everything. What is
# analysed is set in sonar-project.properties (ADR-0229).

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# pull-requests: read is for the SonarQube Cloud scan, which reads the pull request it
# decorates.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    # The instrumented build and the suites take about half an hour, the scan about as long again.
    timeout-minutes: 150
    env:
      # GCC, not clang like the other jobs: only GCC's gcov labels the
      # unwinding edge of a call that may throw, which --exclude-throw-branches
      # below relies on. llvm-cov gcov does not, so with clang the flag
      # excludes nothing (ADR-0217). Prefixed with ccache because Meson adds it
      # only when it picks the compiler itself, and build-linux.sh passes CC and
      # CXX explicitly (ADR-0843).
      CC: ccache gcc-14
      CXX: ccache g++-14
      # A live PostgreSQL so the [postgresql] scenarios run here and the
      # PostgreSQL store is measured; without it they skip and every line of
      # PostgresqlStore.cpp reads as uncovered. Same database and roles as
      # postgres-integration.yml, except that runtime hardening is left on so
      # the hardening paths stay measured.
      MEROVINGIAN_TEST_POSTGRESQL_URI: postgresql://merovingian_test:test-password@127.0.0.1:5432/merovingian_test
      MEROVINGIAN_TEST_POSTGRESQL_MIGRATION_ROLE: merovingian_migration
      MEROVINGIAN_TEST_POSTGRESQL_RUNTIME_ROLE: merovingian_runtime

    services:
      postgres:
        # postgres:16, pinned by digest: this job holds SONAR_TOKEN, in the scan step.
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: merovingian_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merovingian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merovingian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # v4.4.0. Pinned to a commit: this job holds SONAR_TOKEN.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # SonarQube Cloud's new-code detection and blame need the whole history.
          fetch-depth: 0

      # v5.6.0. Pinned to a commit: this job holds SONAR_TOKEN.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'

      # libpng and libturbojpeg build the thumbnail worker; without them Meson drops
      # media/thumbnail_worker_main.cpp and the scan never sees it.
      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            catch2 \
            ccache \
            clang \
            flex \
            g++-14 \
            gcc-14 \
            gcovr \
            libpng-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            llvm \
            m4 \
            perl \
            pkg-config \
            postgresql-client
          # Hash-locked wheels only: this job holds SONAR_TOKEN.
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which installs ccache: on a host runner the action
      # would otherwise install it from a stale package index and fail (ADR-0650). The
      # cache is saved on main only, so a pull request reads what main built and writes
      # nothing back that a later run would then trust.
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-
          max-size: 1G
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Provision migration and runtime roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: merovingian_test
          PGPASSWORD: test-password
          PGDATABASE: merovingian_test
        run: |
          # Two roles share the test database. The migration role carries
          # DDL grants on `public`; the runtime role has DML-only grants
          # through ALTER DEFAULT PRIVILEGES. The connecting login user is
          # a member of both roles and bootstraps the schema as itself, so
          # SET ROLE from the login user (via the test helper) can pick
          # either sibling role. We deliberately do NOT set a default role
          # on the login user — once a session has SET ROLE down to the
          # migration role, PostgreSQL won't let it SET ROLE to a sibling
          # runtime role, which is exactly what the role-enforcement test
          # needs to exercise.
          psql -v ON_ERROR_STOP=1 <<'SQL'
            -- Strip the legacy public-CREATE grant before provisioning roles.
            -- PostgreSQL <= 14 leaves CREATE on schema public granted to
            -- PUBLIC, which would let the runtime role execute DDL and
            -- defeat the role-enforcement assertion. Postgres 15+ already
            -- ships without this grant; the revoke is a no-op there.
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            CREATE ROLE merovingian_migration NOLOGIN;
            CREATE ROLE merovingian_runtime NOLOGIN;
            GRANT merovingian_migration TO merovingian_test;
            GRANT merovingian_runtime TO merovingian_test;
            GRANT CREATE, USAGE ON SCHEMA public TO merovingian_migration;
            GRANT USAGE ON SCHEMA public TO merovingian_runtime;
            -- Tables inherit these grants so the runtime role can read and
            -- write rows regardless of which role created them. Both grantors
            -- are named: ALTER DEFAULT PRIVILEGES is keyed on the creating
            -- role, and since 0.12.5 migrations create tables as
            -- merovingian_migration while the test bootstrap still creates
            -- some as the login user.
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_test IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_test IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_migration IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO merovingian_runtime;
          SQL

      # Mirrors the one-time upgrade step in
      # packaging/postgresql/provision-roles.sql. Since 0.12.5 migrations run
      # as merovingian_migration, and ALTER TABLE is permitted only to an
      # object's owner, so anything the login user created has to move across
      # before a migration can touch it. On a database this job creates from
      # scratch it matches nothing; it is here so CI exercises the exact
      # sequence an operator upgrading a real deployment runs.
      #
      # Scoped to public tables and sequences rather than REASSIGN OWNED:
      # merovingian_test is this container's bootstrap superuser, so REASSIGN
      # OWNED hits its pinned shared dependency and fails with "required by the
      # database system" -- which is exactly how this step first broke.
      - name: Move schema ownership to the migration role
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: merovingian_test
          PGPASSWORD: test-password
          PGDATABASE: merovingian_test
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            SELECT format('ALTER TABLE public.%I OWNER TO %I', tablename, 'merovingian_migration')
              FROM pg_tables
             WHERE schemaname = 'public' AND tableowner = 'merovingian_test'
            \gexec
            SELECT format('ALTER SEQUENCE public.%I OWNER TO %I', sequencename, 'merovingian_migration')
              FROM pg_sequences
             WHERE schemaname = 'public' AND sequenceowner = 'merovingian_test'
            \gexec
          SQL

      # An instrumented build that also runs every suite. It writes the compilation
      # database the scan reads (build-coverage/compile_commands.json, named in
      # sonar-project.properties), with every generated file it names in place.
      - name: Build and test with coverage
        run: sh scripts/build-linux.sh --builddir build-coverage --coverage --skip-job coverage

      - name: Catch2 failure report (runtime logs filtered out)
        if: failure()
        run: |
          if [ -f build-coverage/meson-logs/testlog.txt ]; then
            grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+ \+[0-9]{4}  <(INFO|WARNING|ERROR|DEBUG|CRITICAL)>' build-coverage/meson-logs/testlog.txt \
              | tail -n 300
          fi

      - name: Generate coverage reports
        id: reports
        run: |
          mkdir -p coverage
          # gcovr translates GCC's .gcno/.gcda files into Cobertura XML for
          # Codecov and into SonarQube's generic coverage format for the scan
          # (the path sonar-project.properties names), in one pass so gcov runs
          # once. gcov-14 must match the compiler (gcc-14) that wrote them.
          #
          # Coverage is accumulated from ALL four C++ test types that run
          # under "meson test":
          #   - unit tests      (merovingian-unit-tests binary)
          #   - conformance tests (merovingian-conformance-tests binary)
          #   - integration tests (merovingian-integration-tests binary)
          #   - smoke tests     (run the instrumented server binary directly,
          #                      exercising startup, config, --dry-run paths)
          #
          # build-coverage as a positional argument pins gcovr's .gcda search
          # to the build directory so it does not traverse the whole repo tree.
          # Restrict header coverage to Merovingian's own public API so vendored
          # or platform headers staged under include/ do not dilute the report.
          # --exclude-throw-branches drops the compiler's exception edges
          # (ADR-0217): every call that may throw gets an unwinding branch that
          # only an injected allocation failure reaches, so counting them marks
          # executed lines as partial. Decision branches are still counted. It
          # works only because this job builds with GCC (see env above).
          # --exclude-unreachable-branches drops branches gcov attributes to lines with
          # no code of ours, such as a closing brace where the compiler destroys the
          # function's locals (ADR-0253).
          gcovr \
            --root . \
            --gcov-executable gcov-14 \
            --gcov-ignore-parse-errors \
            --gcov-exclude-directories '.*/subprojects$' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --filter 'src/' \
            --filter 'include/merovingian/' \
            --exclude 'src/main.cpp' \
            --exclude 'tests/' \
            --xml-pretty \
            --html-details \
            --print-summary \
            --output coverage/coverage.xml \
            --html coverage/index.html \
            --sonarqube coverage/sonarqube.xml \
            build-coverage

      # Meson writes the launcher into every compile command ("ccache gcc-14 ..."). The
      # scan identifies the compiler from the first word of each command, so it is removed
      # here and the scan sees gcc-14 itself, as it did before ccache (ADR-0843). Only the
      # copy the scan reads changes; the build has finished.
      - name: Remove the ccache launcher from the compilation database
        run: |
          python3 - build-coverage/compile_commands.json <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              entries = json.load(handle)
          changed = 0
          for entry in entries:
              if "command" in entry and entry["command"].startswith("ccache "):
                  entry["command"] = entry["command"][len("ccache "):]
                  changed += 1
              elif entry.get("arguments", [None])[0] == "ccache":
                  entry["arguments"] = entry["arguments"][1:]
                  changed += 1
          if changed == 0:
              sys.exit(f"{path}: no entry starts with ccache; is CC still 'ccache gcc-14'?")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(entries, handle, indent=2)
          print(f"{path}: removed ccache from {changed} of {len(entries)} entries")
          PY

      # The only step that receives SONAR_TOKEN. The Codecov upload, whose CLI is downloaded
      # with its signature check skipped, runs in the separate `codecov` job below: a step can
      # read every secret its job uses from the runner's memory, so ordering steps within one
      # job would not keep the token from it (ADR-0250, ADR-0846).
      - name: SonarQube Cloud scan
        # A pull request from a fork gets no secrets, so it cannot be scanned; it is
        # scanned on main once merged. Everything above still runs for it.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # v8.3.0. Pinned to a commit because the action receives SONAR_TOKEN.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # After the scan, which reads the reports from the workspace; kept when the scan failed.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  # Its own job, on its own runner, so the Codecov CLI never shares a job with SONAR_TOKEN
  # (ADR-0250, ADR-0846). It needs only the Cobertura report the coverage job uploaded, and
  # runs when the scan failed, so a failed scan does not also lose the Codecov upload.
  codecov:
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v4.4.0, the commit the coverage job pins; Codecov reads the commit and paths from it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download coverage artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ github.sha }}
          path: coverage

      # No artifact means the reports step failed in the coverage job, which already fails the run.
      - name: Upload coverage to Codecov
        if: steps.download.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # CODECOV_TOKEN must be added as a repository secret.
          # Obtain it from https://app.codecov.io/gh/OMG-Software/Merovingian
          # then add it under Settings → Secrets → Actions → New repository secret.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          # "full-test-suite" reflects that the report covers unit,
          # conformance, integration, and smoke tests — not just unit tests.
          flags: full-test-suite
          # Prevent the action running its own gcov pass — we already produced
          # the Cobertura XML above with the matching gcov-14 executable.
          disable_search: true
          # The Codecov action verifies its CLI binary with a GPG signature.
          # The Ubuntu 24.04 runner cannot import the Codecov keyserver key
          # reliably, causing "Can't check signature: No public key" failures
          # before the upload is even attempted.  skip_validation bypasses
          # that check; the binary is still downloaded over HTTPS from
          # cli.codecov.io which is sufficient integrity for our threat model.
          skip_validation: true
          fail_ci_if_error: true
          verbose: true
