name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      # A live PostgreSQL so the [postgresql] scenarios run here and the
      # PostgreSQL store is measured; without it they skip and every line of
      # postgresql_store.cpp reads as uncovered. Same database and roles as
      # postgres-integration.yml, except that runtime hardening is left on so
      # the hardening paths stay measured.
      MEROVINGIAN_TEST_POSTGRESQL_URI: postgresql://merovingian_test:test-password@127.0.0.1:5432/merovingian_test
      MEROVINGIAN_TEST_POSTGRESQL_MIGRATION_ROLE: merovingian_migration
      MEROVINGIAN_TEST_POSTGRESQL_RUNTIME_ROLE: merovingian_runtime

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merovingian_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merovingian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merovingian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            catch2 \
            clang \
            flex \
            gcovr \
            libpng-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            llvm \
            m4 \
            perl \
            pkg-config \
            postgresql-client
          python -m pip install --upgrade pip
          python -m pip install --upgrade meson ninja

      - name: Provision migration and runtime roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: merovingian_test
          PGPASSWORD: test-password
          PGDATABASE: merovingian_test
        run: |
          # Two roles share the test database. The migration role carries
          # DDL grants on `public`; the runtime role has DML-only grants
          # through ALTER DEFAULT PRIVILEGES. The connecting login user is
          # a member of both roles and bootstraps the schema as itself, so
          # SET ROLE from the login user (via the test helper) can pick
          # either sibling role. We deliberately do NOT set a default role
          # on the login user — once a session has SET ROLE down to the
          # migration role, PostgreSQL won't let it SET ROLE to a sibling
          # runtime role, which is exactly what the role-enforcement test
          # needs to exercise.
          psql -v ON_ERROR_STOP=1 <<'SQL'
            -- Strip the legacy public-CREATE grant before provisioning roles.
            -- PostgreSQL <= 14 leaves CREATE on schema public granted to
            -- PUBLIC, which would let the runtime role execute DDL and
            -- defeat the role-enforcement assertion. Postgres 15+ already
            -- ships without this grant; the revoke is a no-op there.
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            CREATE ROLE merovingian_migration NOLOGIN;
            CREATE ROLE merovingian_runtime NOLOGIN;
            GRANT merovingian_migration TO merovingian_test;
            GRANT merovingian_runtime TO merovingian_test;
            GRANT CREATE, USAGE ON SCHEMA public TO merovingian_migration;
            GRANT USAGE ON SCHEMA public TO merovingian_runtime;
            -- Tables inherit these grants so the runtime role can read and
            -- write rows regardless of which role created them. Both grantors
            -- are named: ALTER DEFAULT PRIVILEGES is keyed on the creating
            -- role, and since 0.12.5 migrations create tables as
            -- merovingian_migration while the test bootstrap still creates
            -- some as the login user.
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_test IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_test IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO merovingian_runtime;
            ALTER DEFAULT PRIVILEGES FOR ROLE merovingian_migration IN SCHEMA public
              GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO merovingian_runtime;
          SQL

      # Mirrors the one-time upgrade step in
      # packaging/postgresql/provision-roles.sql. Since 0.12.5 migrations run
      # as merovingian_migration, and ALTER TABLE is permitted only to an
      # object's owner, so anything the login user created has to move across
      # before a migration can touch it. On a database this job creates from
      # scratch it matches nothing; it is here so CI exercises the exact
      # sequence an operator upgrading a real deployment runs.
      #
      # Scoped to public tables and sequences rather than REASSIGN OWNED:
      # merovingian_test is this container's bootstrap superuser, so REASSIGN
      # OWNED hits its pinned shared dependency and fails with "required by the
      # database system" -- which is exactly how this step first broke.
      - name: Move schema ownership to the migration role
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: merovingian_test
          PGPASSWORD: test-password
          PGDATABASE: merovingian_test
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            SELECT format('ALTER TABLE public.%I OWNER TO %I', tablename, 'merovingian_migration')
              FROM pg_tables
             WHERE schemaname = 'public' AND tableowner = 'merovingian_test'
            \gexec
            SELECT format('ALTER SEQUENCE public.%I OWNER TO %I', sequencename, 'merovingian_migration')
              FROM pg_sequences
             WHERE schemaname = 'public' AND sequenceowner = 'merovingian_test'
            \gexec
          SQL

      - name: Build and test with coverage
        run: sh scripts/build-linux.sh --builddir build-coverage --coverage

      - name: Catch2 failure report (runtime logs filtered out)
        if: failure()
        run: |
          if [ -f build-coverage/meson-logs/testlog.txt ]; then
            grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+ \+[0-9]{4}  <(INFO|WARNING|ERROR|DEBUG|CRITICAL)>' build-coverage/meson-logs/testlog.txt \
              | tail -n 300
          fi

      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          # gcovr translates clang's gcov-compatible .gcno/.gcda files into
          # Cobertura XML for Codecov.  llvm-cov gcov is required instead of
          # plain gcov because the binaries were compiled with clang.
          #
          # Coverage is accumulated from ALL four C++ test types that run
          # under "meson test":
          #   - unit tests      (merovingian-unit-tests binary)
          #   - conformance tests (merovingian-conformance-tests binary)
          #   - integration tests (merovingian-integration-tests binary)
          #   - smoke tests     (run the instrumented server binary directly,
          #                      exercising startup, config, --dry-run paths)
          #
          # build-coverage as a positional argument pins gcovr's .gcda search
          # to the build directory so it does not traverse the whole repo tree.
          # Restrict header coverage to Merovingian's own public API so vendored
          # or platform headers staged under include/ do not dilute the report.
          gcovr \
            --root . \
            --gcov-executable "llvm-cov gcov" \
            --gcov-ignore-parse-errors \
            --filter 'src/' \
            --filter 'include/merovingian/' \
            --exclude 'src/main.cpp' \
            --exclude 'tests/' \
            --xml-pretty \
            --html-details \
            --print-summary \
            --output coverage/coverage.xml \
            --html coverage/index.html \
            build-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # CODECOV_TOKEN must be added as a repository secret.
          # Obtain it from https://app.codecov.io/gh/OMG-Software/Merovingian
          # then add it under Settings → Secrets → Actions → New repository secret.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          # "full-test-suite" reflects that the report covers unit,
          # conformance, integration, and smoke tests — not just unit tests.
          flags: full-test-suite
          # Prevent the action running its own gcov pass — we already produced
          # the Cobertura XML above with the correct llvm-cov gcov executable.
          disable_search: true
          # The Codecov action verifies its CLI binary with a GPG signature.
          # The Ubuntu 24.04 runner cannot import the Codecov keyserver key
          # reliably, causing "Can't check signature: No public key" failures
          # before the upload is even attempted.  skip_validation bypasses
          # that check; the binary is still downloaded over HTTPS from
          # cli.codecov.io which is sufficient integrity for our threat model.
          skip_validation: true
          fail_ci_if_error: true
          verbose: true
