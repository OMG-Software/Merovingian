name: Sign artifacts with GPG

on:
  workflow_call:
    inputs:
      source_artifact_name:
        description: 'Name of the uploaded artifact containing the files to sign'
        required: true
        type: string
      output_artifact_name:
        description: 'Name of the artifact to upload after signing'
        required: true
        type: string

jobs:
  sign:
    # GPG_PRIVATE_KEY and GPG_PASSPHRASE are secrets of this environment, not of
    # the repository, so only a ref the environment admits can read them (ADR-0614).
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Import maintainer GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: signed-assets/

      - name: Create detached GPG signatures
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for f in signed-assets/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.asc) continue ;;
            esac
            printf 'Signing %s\n' "$f"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor \
              -o "${f}.asc" "$f"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact_name }}
          path: signed-assets/
          if-no-files-found: error
          retention-days: 30
