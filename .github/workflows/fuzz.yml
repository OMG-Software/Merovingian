name: fuzz

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
  schedule:
    # Weekly extended fuzz run on Sunday at 02:11 UTC. The duration override
    # is applied to the scheduled job below.
    - cron: "11 2 * * 0"
  workflow_dispatch:

# Only pull_request runs share a group, so a new push cancels the superseded run of that PR; every other event gets a unique group and is never cancelled.
concurrency:
  group: fuzz-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-targets:
    runs-on: ubuntu-latest
    env:
      CC: ccache clang
      CXX: ccache clang++

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            ccache \
            clang \
            flex \
            llvm \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which runs apt-get update and installs ccache: on a
      # host runner ccache-action v1.2.24 would otherwise install it from a stale package
      # index and fail (ADR-0650).
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          max-size: 1G
          # Only main writes the cache; PR and merge-queue runs restore it and never evict it.
          save: ${{ github.ref == 'refs/heads/main' }}
          key: ccache-fuzz-${{ github.run_id }}
          restore-keys: ccache-fuzz-

      - name: Resolve fuzz duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=900" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=120" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run all fuzz targets
        run: sh scripts/run-fuzz-targets.sh --builddir build-fuzz --duration "${{ steps.duration.outputs.seconds }}"

      - name: Upload fuzz corpora and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merovingian-fuzz-corpora-${{ github.sha }}
          path: |
            build-fuzz/fuzz-corpus/**
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
          retention-days: 14
