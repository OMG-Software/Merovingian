name: sanitizers

on:
  # Not a bare `push:`: that also fires for a pull request's branch, and the same commit ran this twice (ADR-0511).
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

# Only pull_request runs share a group, so a new push cancels the superseded run of that PR; every other event gets a unique group and is never cancelled.
concurrency:
  group: sanitizers-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    env:
      CC: ccache clang
      CXX: ccache clang++
      # Integration tests take significantly longer under AddressSanitizer +
      # UndefinedBehaviorSanitizer; multiply Meson's per-test timeout so the
      # seccomp/SQLite fork-heavy scenario is not killed by the 600 s default.
      MESON_TEST_TIMEOUT_MULTIPLIER: 3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            ccache \
            clang \
            catch2 \
            flex \
            libpng-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which runs apt-get update and installs ccache: on a
      # host runner ccache-action v1.2.24 would otherwise install it from a stale package
      # index and fail (ADR-0650).
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          max-size: 1G
          # Only main writes the cache; PR and merge-queue runs restore it and never evict it.
          save: ${{ github.ref == 'refs/heads/main' }}
          key: ccache-sanitizers-asan-ubsan-${{ github.run_id }}
          restore-keys: ccache-sanitizers-asan-ubsan-

      - name: Build and test with sanitizers
        run: sh scripts/build-linux.sh --builddir build --buildtype debug --sanitize address,undefined --skip-job asan-ubsan

      - name: Catch2 failure report (runtime logs filtered out)
        if: failure()
        run: |
          sh scripts/catch2-failure-report.sh build/meson-logs/testlog.txt

  tsan:
    runs-on: ubuntu-latest
    env:
      CC: ccache clang
      CXX: ccache clang++
      # ThreadSanitizer is the only sanitizer that detects data races. Point it
      # at the project suppressions file so benign reports from uninstrumented
      # third-party dependencies do not mask races in our own code.
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizer/tsan.supp history_size=7 second_deadlock_stack=1
      # TSan-instrumented binaries run slower than ASan, and the seccomp/SQLite
      # fork-heavy integration scenario can exceed Meson's default 600 s timeout.
      # Use the same multiplier the asan-ubsan job already applies.
      MESON_TEST_TIMEOUT_MULTIPLIER: 3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            ccache \
            clang \
            catch2 \
            flex \
            libpng-dev \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which runs apt-get update and installs ccache: on a
      # host runner ccache-action v1.2.24 would otherwise install it from a stale package
      # index and fail (ADR-0650).
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          max-size: 1G
          # Only main writes the cache; PR and merge-queue runs restore it and never evict it.
          save: ${{ github.ref == 'refs/heads/main' }}
          key: ccache-sanitizers-tsan-${{ github.run_id }}
          restore-keys: ccache-sanitizers-tsan-

      - name: Build and test with ThreadSanitizer
        # bash runs with pipefail, so a failed build or test fails the step and not only tee's status.
        shell: bash
        run: sh scripts/build-linux.sh --builddir build-tsan --buildtype debug --sanitize thread --skip-job tsan 2>&1 | tee tsan-ci-log.txt

      - name: Catch2 failure report (runtime logs filtered out)
        if: failure()
        run: |
          sh scripts/catch2-failure-report.sh build-tsan/meson-logs/testlog.txt

      - name: Upload TSan logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-logs
          path: |
            tsan-ci-log.txt
            build-tsan/meson-logs/testlog.txt
            build-tsan/meson-logs/testlog.json
          retention-days: 7
