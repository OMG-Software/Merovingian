name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze C++
    runs-on: ubuntu-latest

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            clang \
            catch2 \
            flex \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-extended,security-and-quality
          build-mode: manual

      - name: Build
        run: sh scripts/build-linux.sh --builddir build --compile-only

      # Analyse without uploading, so the report can be filtered first (ADR-0226).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:c-cpp'
          upload: never
          output: codeql-results

      # Drops only cpp/unused-static-function under tests/: Catch2 registers each
      # SCENARIO through a static object the rule cannot follow. The rule stays on
      # for production code, and every other rule stays on for tests.
      - name: Filter Catch2 false positives
        run: python3 scripts/filter_codeql_sarif.py codeql-results

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results
          category: '/language:c-cpp'
