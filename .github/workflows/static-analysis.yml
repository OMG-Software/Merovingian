name: static-analysis

on:
  # Not a bare `push:`: that also fires for a pull request's branch, and the same commit ran this twice (ADR-0511).
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

# Only pull_request runs share a group, so a new push cancels the superseded run of that PR; every other event gets a unique group and is never cancelled.
concurrency:
  group: static-analysis-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            clang \
            clang-tidy \
            catch2 \
            flex \
            libcurl4-openssl-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      - name: Generate compile commands
        run: sh scripts/build-linux.sh --builddir build --compile-only

      - name: Run clang-tidy on changed lines
        # bash runs with pipefail, so a failed git diff fails the step instead of reading as "nothing changed".
        shell: bash
        env:
          # The commit the change is compared with: the pull request's base, or the merge
          # queue's base. Empty for a push or a manual run.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # A push's previous tip (all zeros when the push created the branch).
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # The checkout is one commit deep, so the history has no merge base and a
          # three-dot diff fails. A two-dot diff compares the two trees and needs only both
          # commits. Before, a failed three-dot diff behind `|| true` read as "no changed
          # files", and clang-tidy never ran on a pull request.
          # A push to main compares with the tip it replaced, not with main itself, which is
          # the pushed commit and would leave nothing to check. A manual run, or a push that
          # created the branch, compares with the checked-out commit's parent.
          base="${BASE_SHA}"
          if [ -z "${base}" ] && [ "${GITHUB_EVENT_NAME}" = "push" ] &&
            [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${PUSH_BEFORE}"
          fi
          if [ -z "${base}" ]; then
            git fetch --no-tags --deepen=1 origin "${GITHUB_SHA}"
            base="$(git rev-parse HEAD^)"
          fi
          # FETCH_HEAD is the base commit from here on.
          git fetch --no-tags --depth=1 origin "${base}"

          # clang-tidy-diff runs clang-tidy on each changed translation unit with a line
          # filter, so only diagnostics on added or changed lines count: code that predates
          # the gate is not failed by an unrelated edit to the same file (ADR-0847).
          # It exits 1 when any run reports an error or is killed by the timeout.
          # Use the script of the same LLVM release as the clang-tidy it drives.
          clang_tidy="$(command -v clang-tidy)"
          major="$("${clang_tidy}" --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          clang_tidy_diff="/usr/bin/clang-tidy-diff-${major}.py"
          if [ -z "${major}" ] || [ ! -f "${clang_tidy_diff}" ]; then
            echo "::error::no clang-tidy-diff script for clang-tidy ${major:-of unknown version}"
            exit 1
          fi

          git diff -U0 --diff-filter=d FETCH_HEAD HEAD -- src tests | \
            python3 "${clang_tidy_diff}" -p1 -path build -iregex '.*\.cpp' \
              -clang-tidy-binary "${clang_tidy}" -j "$(nproc)" -timeout 120

      - name: Run unsafe source gates
        run: bash scripts/reject-unsafe.sh
