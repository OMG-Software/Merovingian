name: release

# Every v* tag publishes a versioned GitHub release (ADR-0597). The tag must be
# exactly v<meson.build version>; check-tag refuses any other before a package
# is built. The packages are the ones the rolling `latest` release ships: this
# workflow calls packages.yml, whose own jobs build, stage and sign them for the
# tag (ADR-0652). The hardened Linux and FreeBSD jobs here are release gates and
# the source of the release evidence; their builds are not published.
on:
  push:
    tags:
      - 'v*'

jobs:
  check-tag:
    name: Check the tag names this version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false
          # All history and branches: without them origin/main does not exist
          # on a tag build and the ancestor check below could not pass honestly.
          fetch-depth: 0

      # ADR-0614: a tag publishes a signed release, so it must name a commit
      # that reached main. A git failure (no origin/main) refuses too.
      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag ${GITHUB_REF_NAME} names ${GITHUB_SHA}, which is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Compare the tag with meson.build
        id: version
        run: |
          version=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" meson.build)
          if [ -z "$version" ]; then
            echo "cannot read the project version from meson.build" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name this commit's version; expected v${version}" >&2
            exit 1
          fi
          # Every 0.x release is a prerelease; 1.0.0 is the production release
          # (docs/versioning.md), and from then on a tag publishes a full release.
          case "$version" in
            0.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  # The full suite on a hardened Linux build, the release gates, and the
  # evidence the release notes carry. The build is not an asset: Linux ships as
  # the distribution packages and the static tarball (ADR-0652).
  linux-release-evidence:
    name: Linux release gates and evidence
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # libpng-dev and libturbojpeg0-dev build merovingian-thumbnail-worker,
      # which the evidence covers. Every pkg-config module that
      # scripts/build-linux.sh checks needs its -dev package here; this step
      # runs only for a v* tag, so a missing one is first seen on release day
      # (ADR-0651).
      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            ccache \
            clang \
            catch2 \
            flex \
            libcurl4-openssl-dev \
            libpng-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which runs apt-get update and installs ccache: on a
      # host runner ccache-action v1.2.24 would otherwise install it from a stale package
      # index and fail (ADR-0650).
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-linux-release-${{ github.run_id }}
          restore-keys: ccache-linux-release-

      - name: Build and test hardened Linux
        run: sh scripts/build-linux.sh --builddir build-linux-release --profile hardened --skip-job release-linux

      - name: Collect release evidence
        run: sh scripts/collect-release-evidence.sh "Linux x86_64" build-linux-release release-evidence-linux-x86_64.md

      - name: Validate phase 1 configuration gates
        run: bash scripts/validate-phase1-config.sh build-linux-release

      - name: Reject unsafe allocation patterns
        run: bash scripts/reject-unsafe.sh

      - name: Check release readiness metadata
        run: sh scripts/check-release-readiness.sh

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux-${{ github.ref_name }}
          path: release-evidence-linux-x86_64.md
          if-no-files-found: error
          retention-days: 30

  # As linux-release-evidence, on FreeBSD 15. The FreeBSD asset is the .pkg
  # packages.yml builds, not a tarball (ADR-0652).
  freebsd-release-evidence:
    name: FreeBSD release gates and evidence
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      - name: Build and test hardened FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          # The newest FreeBSD 15.x on x86_64, the action's default architecture (ADR-0652).
          release: '15'
          run: |
            set -e
            pkg install -y meson ninja llvm catch2 pkgconf git perl5 bison flex gmake openssl libsodium postgresql17-client python3 curl png libjpeg-turbo
            sh scripts/build-bsd.sh --builddir build-freebsd-release --profile hardened --skip-job release-freebsd
            sh scripts/collect-release-evidence.sh "FreeBSD x86_64" build-freebsd-release release-evidence-freebsd-x86_64.md || true
            sh scripts/check-release-readiness.sh
            # The VM action copies the workspace back over one connection;
            # without the build tree that is megabytes, not gigabytes.
            rm -rf build-freebsd-release

      - name: Upload FreeBSD release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-freebsd-${{ github.ref_name }}
          path: release-evidence-freebsd-x86_64.md
          if-no-files-found: warn
          retention-days: 30

  # ADR-0650, ADR-0652: every package the tag ships, one per platform release,
  # built with the hardened profile, installed and booted by the same jobs as on
  # every pull request, then staged with the SBOM, licence summary and SHA256SUMS
  # and GPG-signed by packages.yml's own staging and signing jobs, as for `latest`.
  distro-packages:
    name: Distribution packages
    needs: check-tag
    uses: ./.github/workflows/packages.yml
    # A ceiling for the called jobs, each of which names its own permissions.
    # contents: write is there only because publish-latest declares it; that job
    # runs for a push to main and is skipped for a tag.
    permissions:
      contents: write
      attestations: write
      id-token: write
    # packages.yml's signing job calls sign-artifacts.yml, whose key is a secret
    # of the `release` environment that the called job declares (ADR-0614).
    secrets: inherit

  publish-release:
    needs:
      - check-tag
      - linux-release-evidence
      - freebsd-release-evidence
      - distro-packages
    # A called workflow's result is success only when none of its jobs failed;
    # a skipped signing job leaves no signed-packages artifact, and the download
    # below then fails the publish.
    if: |
      !failure() &&
      !cancelled() &&
      needs.distro-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      # Uploaded by packages.yml's sign-package-assets in this same run.
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-packages
          path: release-assets/

      - name: Download Linux release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence-linux-${{ github.ref_name }}
          path: release-evidence/

      - name: Download FreeBSD release evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-evidence-freebsd-${{ github.ref_name }}
          path: release-evidence/

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Release assets

          This tag publishes hardened-profile x86_64 packages built by GitHub Actions, the
          same set the rolling `latest` release carries. Every package names the platform it
          installs on, and installs only on that release:

          - `.deb` for Ubuntu 24.04 LTS, 26.04 LTS and 26.10 (`-ubuntu<release>.deb`) and
            Debian 13 (`-debian13.deb`)
          - `.rpm` for Fedora 44 and 45 (`.fc44`, `.fc45`), RHEL 10 and compatible
            distributions (`.el10`), openSUSE Tumbleweed (`.tumbleweed`) and openSUSE
            Leap 16.0 (`.leap16`)
          - a FreeBSD 15 `.pkg` (`-freebsd15.pkg`), and OpenBSD and NetBSD packages
            (`-openbsd<release>.tgz`, `-netbsd<release>.tgz`)
          - a static Linux tarball (`-linux-static-x86_64.tar.gz`) for any other Linux
          - SBOM in SPDX 2.3 (`merovingian.spdx.json`) and CycloneDX 1.5 (`merovingian.cdx.json`) JSON
          - a machine-readable license summary (`merovingian.licenses.json`)
          - `SHA256SUMS`, listing every file above
          - a detached GPG signature (`.asc`) for every file above

          Validation performed by this workflow:

          - the tag names the version in `meson.build`
          - hardened Linux and FreeBSD builds with full Meson test suites
          - every package built with the hardened profile by the same jobs as on every pull
            request; every Ubuntu, Debian and Fedora package and the FreeBSD package installed
            and its server booted through the startup hardening gate
          - phase 1 configuration validation on Linux
          - unsafe-source gate
          - release-readiness metadata gate
          - detached GPG signatures by the maintainer key

          Verification:

          - SLSA provenance: `gh attestation verify <package> --repo OMG-Software/Merovingian`
          - GPG signature: `gpg --verify <file>.asc <file>` (import the maintainer key from `docs/release-process.md`)
          - checksums: `sha256sum --check --ignore-missing SHA256SUMS`

          ## Complement

          The maintainer runs the external Complement suite against this version's Debian 13
          package from the rolling `latest` release before tagging, and attaches the result to
          this release once it is published (`docs/release-process.md`, "Complement"):

          - `complement-results-<version>.json`: the package, server binary and image tested,
            the Complement commit, the skip list the run was judged by, and the verdict
          - `complement-<version>.jsonl`: the raw `go test -json` log
          - `merovingian_<version>_amd64-debian.deb`: the package that was tested, built from
            this tag's commit by the `latest` run and attached under that name, apart from this
            release's own `-debian13.deb`; its SHA-256 and its server binary's are in the results

          Each has a detached signature by the maintainer key:
          `gpg --verify complement-results-<version>.json.asc complement-results-<version>.json`.
          A release without these files has not been tested against Complement.

          ## Package checksums

          EOF
          # The quoted heredoc keeps `$` and backticks literal, so the Complement
          # section's file names are filled in here, before anything is appended.
          version=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" meson.build)
          if [ -z "$version" ]; then
            echo "cannot read the project version from meson.build" >&2
            exit 1
          fi
          sed -i "s/<version>/${version}/g" release-notes.md
          while IFS= read -r line; do
            printf -- '- `%s`\n' "$line" >> release-notes.md
          done < release-assets/SHA256SUMS

          printf '\n## Release evidence\n\n' >> release-notes.md
          printf 'Compiler version, link-time hardening confirmation, pinned dependency versions, test log summary, and the mandatory fuzz target list for each platform build in this release.\n\n' >> release-notes.md
          for evidence_file in release-evidence/*.md; do
            [ -f "$evidence_file" ] || continue
            cat "$evidence_file" >> release-notes.md
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*
          prerelease: ${{ needs.check-tag.outputs.prerelease == 'true' }}
