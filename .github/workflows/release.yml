name: release

# Every v* tag publishes a versioned GitHub release (ADR-0597). The tag must be
# exactly v<meson.build version>; check-tag refuses any other before a package
# is built. The rolling `latest` release comes from packages.yml, not here.
on:
  push:
    tags:
      - 'v*'

jobs:
  check-tag:
    name: Check the tag names this version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false
          # All history and branches: without them origin/main does not exist
          # on a tag build and the ancestor check below could not pass honestly.
          fetch-depth: 0

      # ADR-0614: a tag publishes a signed release, so it must name a commit
      # that reached main. A git failure (no origin/main) refuses too.
      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag ${GITHUB_REF_NAME} names ${GITHUB_SHA}, which is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Compare the tag with meson.build
        id: version
        run: |
          version=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" meson.build)
          if [ -z "$version" ]; then
            echo "cannot read the project version from meson.build" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name this commit's version; expected v${version}" >&2
            exit 1
          fi
          # Every 0.x release is a prerelease; 1.0.0 is the production release
          # (docs/versioning.md), and from then on a tag publishes a full release.
          case "$version" in
            0.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  linux-release-package:
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to publish SLSA
      # provenance attestations to the repository's attestations store.
      attestations: write
      id-token: write
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # libpng-dev and libturbojpeg0-dev build merovingian-thumbnail-worker,
      # which stage-release-tarball.sh requires.
      - name: Install dependencies
        run: |
          sh scripts/ci-apt-update.sh  # falls back to public DNS (ADR-0650)
          sudo apt-get install -y \
            bison \
            ccache \
            clang \
            catch2 \
            flex \
            libpng-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libturbojpeg0-dev \
            m4 \
            perl \
            pkg-config
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-build.txt

      # After the dependency step, which runs apt-get update and installs ccache: on a
      # host runner ccache-action v1.2.24 would otherwise install it from a stale package
      # index and fail (ADR-0650).
      - name: Cache compiler output with ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-linux-release-${{ github.run_id }}
          restore-keys: ccache-linux-release-

      - name: Build hardened Linux package
        run: sh scripts/build-linux.sh --builddir build-linux-release --profile hardened --skip-job release-linux

      - name: Collect release evidence
        run: sh scripts/collect-release-evidence.sh "Linux x86_64" build-linux-release release-evidence-linux-x86_64.md

      - name: Validate phase 1 configuration gates
        run: bash scripts/validate-phase1-config.sh build-linux-release

      - name: Reject unsafe allocation patterns
        run: bash scripts/reject-unsafe.sh

      - name: Check release readiness metadata
        run: sh scripts/check-release-readiness.sh

      - name: Stage Linux release package
        run: |
          package_root="merovingian-${GITHUB_REF_NAME}-linux-x86_64"
          sh scripts/stage-release-tarball.sh build-linux-release "${package_root}"
          tar -czf "${package_root}.tar.gz" "${package_root}"
          sha256sum "${package_root}.tar.gz" > "${package_root}.tar.gz.sha256"

      - name: Attest Linux release package
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: merovingian-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Upload Linux release package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ github.ref_name }}
          path: |
            merovingian-${{ github.ref_name }}-linux-x86_64.tar.gz
            merovingian-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux-${{ github.ref_name }}
          path: release-evidence-linux-x86_64.md
          if-no-files-found: error
          retention-days: 30

  freebsd-release-package:
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to publish SLSA
      # provenance attestations to the repository's attestations store.
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      - name: Build hardened FreeBSD package
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          run: |
            tag="${GITHUB_REF_NAME}"
            pkg install -y meson ninja llvm catch2 pkgconf git perl5 bison flex gmake openssl libsodium postgresql17-client python3 curl png libjpeg-turbo
            sh scripts/build-bsd.sh --builddir build-freebsd-release --profile hardened --skip-job release-freebsd
            sh scripts/collect-release-evidence.sh "FreeBSD x86_64" build-freebsd-release release-evidence-freebsd-x86_64.md || true
            sh scripts/check-release-readiness.sh
            package_root="merovingian-${tag}-freebsd-x86_64"
            sh scripts/stage-release-tarball.sh build-freebsd-release "${package_root}"
            tar -czf "${package_root}.tar.gz" "${package_root}"
            digest="$(sha256 -q "${package_root}.tar.gz")"
            printf '%s  %s\n' "${digest}" "${package_root}.tar.gz" > "${package_root}.tar.gz.sha256"

      - name: Attest FreeBSD release package
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: merovingian-${{ github.ref_name }}-freebsd-x86_64.tar.gz

      - name: Upload FreeBSD release package
        uses: actions/upload-artifact@v7
        with:
          name: release-freebsd-${{ github.ref_name }}
          path: |
            merovingian-${{ github.ref_name }}-freebsd-x86_64.tar.gz
            merovingian-${{ github.ref_name }}-freebsd-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload FreeBSD release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-freebsd-${{ github.ref_name }}
          path: release-evidence-freebsd-x86_64.md
          if-no-files-found: warn
          retention-days: 30

  # ADR-0650: the tag's .deb and .rpm packages, one per distribution release,
  # built, installed and booted by the same jobs as on every pull request.
  distro-packages:
    name: Distribution packages
    needs: check-tag
    uses: ./.github/workflows/packages.yml
    # A ceiling for the called jobs, each of which names its own permissions.
    # contents: write is there only because publish-latest declares it; that job
    # runs for a push to main and is skipped for a tag.
    permissions:
      contents: write
      attestations: write
      id-token: write

  stage-release-assets:
    name: Stage unsigned release assets
    needs:
      - linux-release-package
      - freebsd-release-package
      - distro-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false
      - name: Download Linux release package
        uses: actions/download-artifact@v8
        with:
          name: release-linux-${{ github.ref_name }}
          path: release-assets/
      - name: Download FreeBSD release package
        uses: actions/download-artifact@v8
        with:
          name: release-freebsd-${{ github.ref_name }}
          path: release-assets/
      # Each of these names its distribution release (-ubuntu24.04, .fc44,
      # .el10, .opensuse, .leap16), so they land side by side. The Debian
      # trixie package is not among them: the Complement step attaches the
      # trixie package it tested under that name, and never replaces an asset
      # (docs/release-process.md, "Complement").
      - name: Download Ubuntu 24.04 package
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-deb-package-24.04
          path: release-assets/
      - name: Download Ubuntu 26.04 package
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-deb-package-26.04
          path: release-assets/
      - name: Download Ubuntu rolling package
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-deb-package-rolling
          path: release-assets/
      - name: Download Fedora 44 package
        uses: actions/download-artifact@v8
        with:
          name: rpm-package-fc44
          path: release-assets/
      - name: Download Fedora latest package
        uses: actions/download-artifact@v8
        with:
          name: rpm-package-latest
          path: release-assets/
      - name: Download RHEL-compatible package
        uses: actions/download-artifact@v8
        with:
          name: rhel-rpm-package
          path: release-assets/
      - name: Download OpenSUSE Tumbleweed package
        uses: actions/download-artifact@v8
        with:
          name: opensuse-rpm-package
          path: release-assets/
      - name: Download OpenSUSE Leap 16.0 package
        uses: actions/download-artifact@v8
        with:
          name: opensuse-leap-rpm-package
          path: release-assets/
      - name: Write package checksums
        working-directory: release-assets
        run: |
          for f in *.deb *.rpm; do
            sha256sum "$f" > "$f.sha256"
          done
      # Staged before signing, so the SBOM and the licence summary get detached
      # signatures like every package (ADR-0598).
      - name: Generate SBOM
        run: |
          python scripts/generate_sbom.py \
            --spdx release-assets/merovingian.spdx.json \
            --cyclonedx release-assets/merovingian.cdx.json \
            --commit "${{ github.sha }}" \
            --repository "${{ github.repository }}"
      - name: Generate license summary
        run: python scripts/generate-license-summary.py release-assets/merovingian.licenses.json
      - name: Upload unsigned release assets
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  sign-release-assets:
    name: GPG-sign release assets
    needs: stage-release-assets
    # GitHub implicitly ANDs a bare expression with success(), and that default
    # success() returns false when any job in the broader dependency graph was
    # skipped (e.g. optional retry jobs). Using !failure() && !cancelled() plus an
    # explicit result check makes signing depend only on the staging job outcome.
    if: |
      !failure() &&
      !cancelled() &&
      needs.stage-release-assets.result == 'success'
    uses: ./.github/workflows/sign-artifacts.yml
    with:
      source_artifact_name: unsigned-release-assets
      output_artifact_name: signed-release-assets
    # The key is a secret of the `release` environment, which the called job
    # declares; a job that calls a reusable workflow cannot (ADR-0614).
    secrets: inherit

  publish-release:
    needs:
      - check-tag
      - sign-release-assets
    if: |
      !failure() &&
      !cancelled() &&
      needs.sign-release-assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes; the publish step takes its token as an input.
          persist-credentials: false

      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: release-assets/

      - name: Download Linux release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence-linux-${{ github.ref_name }}
          path: release-evidence/

      - name: Download FreeBSD release evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-evidence-freebsd-${{ github.ref_name }}
          path: release-evidence/

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Release assets

          This tag publishes hardened-profile packages built by GitHub Actions.

          Included assets:

          - Linux x86_64 tarball, detached GPG signature (`.asc`), and SHA-256 checksum
          - FreeBSD x86_64 tarball, detached GPG signature (`.asc`), and SHA-256 checksum
          - `.deb` packages for Ubuntu 24.04 LTS, 26.04 LTS and the current interim release,
            each named after the release it installs on (`-ubuntu<release>.deb`)
          - `.rpm` packages for Fedora 44 and the current Fedora (`.fc<release>`), RHEL 10 and
            compatible distributions (`.el10`), openSUSE Tumbleweed (`.opensuse`) and openSUSE
            Leap 16.0 (`.leap16`)
          - each package with a detached GPG signature (`.asc`) and SHA-256 checksum. A package
            installs only on the release it names
          - SBOM in SPDX 2.3 (`merovingian.spdx.json`) and CycloneDX 1.5 (`merovingian.cdx.json`) JSON, each with a detached GPG signature
          - Machine-readable license summary (`merovingian.licenses.json`) and its detached GPG signature

          Each tarball holds `bin/` and `libexec/merovingian/`. The server and the thumbnail
          worker look for their helper binaries under the build's install prefix, which the
          tarball records in `INSTALL-PREFIX`; install both directories there.

          Validation performed by this workflow:

          - the tag names the version in `meson.build`
          - hardened Linux and FreeBSD builds
          - full Meson test suites on both platforms
          - every Ubuntu, Debian and Fedora package installed and its server booted through the
            startup hardening gate
          - phase 1 configuration validation on Linux
          - unsafe-source gate
          - release-readiness metadata gate
          - detached GPG signatures by the maintainer key

          Verification:

          - GPG signature, the primary check: `gpg --verify <file>.asc <file>` (import the maintainer key from
            `docs/release-process.md`)
          - SLSA provenance of a tarball: `gh attestation verify <tarball> --repo OMG-Software/Merovingian --signer-workflow OMG-Software/Merovingian/.github/workflows/release.yml --source-ref refs/tags/v<version>`
          - SLSA provenance of a package: `gh attestation verify <package> --repo OMG-Software/Merovingian --signer-workflow OMG-Software/Merovingian/.github/workflows/packages.yml --source-ref refs/tags/v<version>`
          - Keep both `--signer-workflow` and `--source-ref`: with `--repo` alone the check accepts an attestation
            made on any branch of the repository

          ## Complement

          The maintainer runs the external Complement suite against this version's Debian
          trixie package before tagging, and attaches the result to this release once it is
          published (`docs/release-process.md`, "Complement"):

          - `complement-results-<version>.json`: the package, server binary and image tested,
            the Complement commit, the skip list the run was judged by, and the verdict
          - `complement-<version>.jsonl`: the raw `go test -json` log
          - `merovingian_<version>_amd64-debian.deb`: the package that was tested, built
            from this tag's commit; its SHA-256 and its server binary's are in the results

          Each has a detached signature by the maintainer key:
          `gpg --verify complement-results-<version>.json.asc complement-results-<version>.json`.
          A release without these files has not been tested against Complement.

          ## Package checksums

          EOF
          # The quoted heredoc keeps `$` and backticks literal, so the Complement
          # section's file names are filled in here, before anything is appended.
          version=$(sed -n "s/^  version: '\([0-9][0-9.]*\)',$/\1/p" meson.build)
          if [ -z "$version" ]; then
            echo "cannot read the project version from meson.build" >&2
            exit 1
          fi
          sed -i "s/<version>/${version}/g" release-notes.md
          for sumfile in release-assets/*.sha256; do
            [ -f "$sumfile" ] || continue
            printf -- '- `%s`\n' "$(cat "$sumfile")" >> release-notes.md
          done

          printf '\n## Release evidence\n\n' >> release-notes.md
          printf 'Compiler version, link-time hardening confirmation, pinned dependency versions, test log summary, and the mandatory fuzz target list for each platform build in this release.\n\n' >> release-notes.md
          for evidence_file in release-evidence/*.md; do
            [ -f "$evidence_file" ] || continue
            cat "$evidence_file" >> release-notes.md
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*
          prerelease: ${{ needs.check-tag.outputs.prerelease == 'true' }}
