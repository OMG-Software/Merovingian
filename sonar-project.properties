# SonarQube Cloud, run from CI by .github/workflows/sonarcloud.yml (ADR-0250).
#
# Automatic analysis is switched off in the project's Administration > Analysis
# Method page: the two cannot run together, and this file is what CI reads.
sonar.organization=omg-software
sonar.projectKey=OMG-Software_Merovingian
sonar.projectName=Merovingian
sonar.sources=.
sonar.sourceEncoding=UTF-8

# C and C++ are analysed with the flags the CI build really used: the workflow
# builds into build-sonar/ with scripts/build-linux.sh, and Meson writes the
# compilation database there.
sonar.cfamily.compile-commands=build-sonar/compile_commands.json

# Excluded: test code and developer or CI tooling (ADR-0229). Their findings
# (world-writable temporary directories, hard-coded test credentials, fixed-seed
# generators, http:// fixtures, scripts reading the paths CI hands them) are what
# tests and build tooling do on purpose. Also excluded: the CI build's own
# directory and any Meson subproject it downloads, which are not this project's
# sources.
#
# Still analysed, and must stay so: src/ and include/ (the server), packaging/
# (files installed on a user's system, such as the NetBSD rc.d script), and
# .github/ (the workflows: unpinned actions and unlocked dependencies are real
# supply-chain findings). Do not widen this list to quiet a finding in those.
# tests/tooling/test_sonarcloud_config.py holds both lists to this.
sonar.exclusions=tests/**,scripts/**,build.py,llvm.sh,.codex/**,build-sonar/**,subprojects/**
